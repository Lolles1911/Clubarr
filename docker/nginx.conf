worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log off;
    client_max_body_size 4m;
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /app/public;
        index index.php;

        # Never serve hidden files (.env, .git, ...).
        location ~ /\.(?!well-known) { deny all; }

        location ~* ^/(css|js|fonts)/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / { try_files $uri $uri/ /index.php?$query_string; }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # No other PHP file can be run.
        location ~ \.php$ { return 404; }
    }
}
